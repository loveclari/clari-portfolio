# Build settings for AWS Amplify Hosting.
# Committing this overrides the console settings, which still assume the
# old Nuxt 2 project (Node 16 and a real dist/ directory).
#
# Nuxt 4 needs Node 22+, and `nuxt generate` writes to .output/public.
# It also leaves a dist -> .output/public symlink for backwards
# compatibility, which Amplify's artifact collection does not follow, so
# baseDirectory points at the real directory.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - node -v
        - npm ci
    build:
      commands:
        - npm run generate
  artifacts:
    baseDirectory: .output/public
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
